<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Bitcoin/crypto circle symbol (top-right area) -->
  <circle cx="44" cy="16" r="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="44" y="20.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#60a5fa">₿</text>
  
  <!-- Calculator body lines -->
  <!-- Display area -->
  <rect x="10" y="12" rx="3" width="24" height="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="30" y="20" text-anchor="end" font-family="'Courier New',monospace" font-weight="600" font-size="7" fill="#22c55e">1.25</text>
  
  <!-- Grid buttons (3x3) -->
  <rect x="10" y="28" rx="2" width="8" height="7" fill="#334155"/>
  <rect x="21" y="28" rx="2" width="8" height="7" fill="#334155"/>
  <rect x="32" y="28" rx="2" width="8" height="7" fill="#334155"/>
  
  <rect x="10" y="38" rx="2" width="8" height="7" fill="#334155"/>
  <rect x="21" y="38" rx="2" width="8" height="7" fill="#334155"/>
  <rect x="32" y="38" rx="2" width="8" height="7" fill="#334155"/>
  
  <rect x="10" y="48" rx="2" width="8" height="7" fill="#334155"/>
  <rect x="21" y="48" rx="2" width="8" height="7" fill="#334155"/>
  <rect x="32" y="48" rx="2" width="8" height="7" fill="url(#accent)"/>
  
  <!-- Equal sign on accent button -->
  <line x1="34" y1="50.5" x2="38" y2="50.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="34" y1="53" x2="38" y2="53" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Mini chart (bottom-right, representing trading) -->
  <polyline points="44,54 48,48 51,50 55,42" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="42" r="2" fill="#22c55e"/>
</svg>